<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Comrade Chat · 관리자</title>
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/admin.css" />
</head>
<body>
  <div id="admin-app" class="admin-app">
    <header class="chat-header">
      <div class="brand-block">
        <span class="brand">Comrade Chat</span>
        <span class="tagline">관리자 화면</span>
      </div>
      <div class="header-actions">
<button id="btn-theme" class="icon-btn" type="button" title="테마 전환" aria-label="테마 전환">
          <span class="theme-icon theme-icon-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
          <span class="theme-icon theme-icon-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
        </button>
      </div>
    </header>

    <main class="admin-main">
      <section class="admin-stats">
        <div class="stat-card">
          <div class="stat-value" id="stat-connected">0</div>
          <div class="stat-label">현재 접속자</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-total-messages">0</div>
          <div class="stat-label">총 메시지 수</div>
        </div>
        <div class="stat-card danger-zone">
          <button id="btn-clear-history">전체 채팅 기록 삭제</button>
        </div>
      </section>

      <section class="admin-section">
        <h2>현재 접속자</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>이름</th>
                <th>IP</th>
                <th>접속 시각</th>
                <th>마지막 활동</th>
                <th>User-Agent</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="table-users"></tbody>
          </table>
        </div>
      </section>

      <section class="admin-section">
        <h2>최근 로그인 시도 (최대 50건)</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>시각</th>
                <th>입력한 이름</th>
                <th>IP</th>
                <th>결과</th>
              </tr>
            </thead>
            <tbody id="table-login-attempts"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
